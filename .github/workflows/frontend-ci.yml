name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Ensure secrets are not in public env template
        run: |
          if grep -E 'SECRET|PASSWORD|PRIVATE|sk_live|whsec_' .env.example | grep -v PUBLISHABLE | grep -v '#'; then
            echo "Suspicious secret-like entries in frontend .env.example" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
          NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: "false"
