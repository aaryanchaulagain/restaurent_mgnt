name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: suvakamana_test
          POSTGRES_USER: suvakamana
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suvakamana -d suvakamana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql, redis
          coverage: none
      - name: Validate composer
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Ensure env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo ".env must not be tracked" >&2
            exit 1
          fi
          git check-ignore -q .env || (echo ".env must be gitignored" >&2; exit 1)
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_DATABASE=suvakamana_restaurant/DB_DATABASE=suvakamana_test/' .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=suvakamana/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=secret/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          echo "DB_PORT=5432" >> .env
      - name: Run migrations
        run: php artisan migrate --force
      - name: Dependency audit (report only)
        run: composer audit || true
      - name: Staging readiness (CI-safe local evaluate)
        run: |
          php artisan app:production-readiness --env=local || true
          test -f ../scripts/deploy-staging.sh
          test -f ../scripts/verify-staging.sh
          ! grep -R "sk_live_" ../scripts ../backend/.env.staging.example ../frontend/.env.staging.example
          ! grep -R "C:\\\\Users\\\\" ../scripts
      - name: Run tests
        run: php artisan test
